# JobsitePro — Nginx complet (fichiers statiques + API PocketBase)
# sudo cp deployment/nginx-chantiertrack-complet.conf /etc/nginx/sites-available/chantiertrack
# sudo ln -sf /etc/nginx/sites-available/chantiertrack /etc/nginx/sites-enabled/chantiertrack
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name 127.0.0.1 _;

    client_max_body_size 50M;
    root /opt/chantiertrack/pb_public;

    # Scan OCR — contourne PocketBase si les hooks pb.js ne chargent pas
    location = /api/jobsitepro/ocr-health {
        proxy_pass http://127.0.0.1:3101/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location = /api/jobsitepro/scan-receipt {
        proxy_pass http://127.0.0.1:3101/scan-receipt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        client_max_body_size 20M;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/files/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }

    location /push/ {
        proxy_pass http://127.0.0.1:3099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ocr/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        client_max_body_size 20M;
    }

    location /contact/ {
        proxy_pass http://127.0.0.1:3103/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /integrations/ {
        proxy_pass http://127.0.0.1:3102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /site/ {
        alias /opt/chantiertrack/pb_public/site/;
        index index.html;
    }

    location = /site {
        return 301 /site/;
    }

    location /patron/ {
        alias /opt/chantiertrack/pb_public/patron/;
        index index.html;
    }

    location = /patron {
        return 301 /patron/;
    }

    location /employe/ {
        alias /opt/chantiertrack/pb_public/employe/;
        index index.html;
    }

    location = /employe {
        return 301 /employe/;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
