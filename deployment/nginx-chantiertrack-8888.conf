# JobsitePro — à copier sur le serveur :
#   sudo cp deployment/nginx-chantiertrack-8888.conf /etc/nginx/sites-available/chantiertrack
#   sudo ln -sf /etc/nginx/sites-available/chantiertrack /etc/nginx/sites-enabled/chantiertrack
#   sudo nginx -t && sudo nginx -s reload

server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name 127.0.0.1 _;

    client_max_body_size 50M;

    location /push/ {
        proxy_pass http://127.0.0.1:3099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ocr/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
