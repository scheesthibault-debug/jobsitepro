# JobsitePro — à utiliser si le port 8080 est déjà pris par Nginx (pas Docker seul)
# sudo cp ... /etc/nginx/sites-available/chantiertrack
# sudo ln -sf ... /etc/nginx/sites-enabled/chantiertrack
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name 127.0.0.1 _;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
    location /api/files/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }
    location /push/ {
        proxy_pass http://127.0.0.1:3099/;
        proxy_set_header Host $host;
    }
    location /ocr/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_set_header Host $host;
        client_max_body_size 20M;
    }
    location /patron/ {
        alias /opt/chantiertrack/pb_public/patron/;
        index index.html;
    }
    location = /patron { return 301 /patron/; }
    location /employe/ {
        alias /opt/chantiertrack/pb_public/employe/;
        index index.html;
    }
    location = /employe { return 301 /employe/; }
    location / {
        return 302 /patron/;
    }
}
